name: Public software and evidence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile tools/*.py power/*.py image_service/*.py image_service/service/*.py image_service/sources/*.py mario/*.py mario/sealed/*.py mario/continuous/*.py pong/*.py pong/relearn/*.py relay/*.py metal/*.py kernel/*.py recipe/*.py recognition/*.py resident/*.py capability/*.py streaming/*.py coprocessor/*.py
      - run: g++ -std=c++17 -fsyntax-only recognition/cpu_bench.cpp
      - run: g++ -std=c++17 -fsyntax-only src/primitive_cpu.cpp
